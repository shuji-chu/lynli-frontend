<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lynli 独立电商后台</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="top-nav">
        <div class="nav-tabs">
            <div class="tab-btn active" data-id="dashboard" onclick="switchPage('dashboard', this)">数据看板</div>
            <div class="tab-btn" data-id="orders" onclick="switchPage('orders', this)">订单与物流</div>
            <div class="tab-btn" data-id="users" onclick="switchPage('users', this)">用户管理</div>
            <div class="tab-btn" data-id="products" onclick="switchPage('products', this)">商品库</div>
            <div class="tab-btn" data-id="spider" onclick="switchPage('spider', this)">AI 选品</div>
        </div>
        <div class="user-profile">
            <img src="https://via.placeholder.com/32" class="avatar">
            <span>admin@lynli.com</span>
        </div>
    </div>

    <div class="main-content">
        <div id="page-dashboard" class="page active"><div id="content-dashboard"></div></div>
        <div id="page-orders" class="page"><div id="content-orders"></div></div>
        <div id="page-users" class="page"><div id="content-users"></div></div>
        <div id="page-products" class="page"><div id="content-products"></div></div>
        <div id="page-spider" class="page"><div id="content-spider"></div></div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
