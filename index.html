<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lynli 电商后台</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- 登录页 -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Lynli 电商管理</h2>
            <select id="login-role">
                <option value="super">超级管理员 (全权限)</option>
                <option value="op">运营人员 (受限权限)</option>
            </select>
            <button class="login-btn" onclick="handleLogin()">登录系统</button>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="app">
        <div class="top-nav">
            <div class="nav-tabs">
                <div class="tab-btn" data-target="orders" onclick="switchPage('orders', this)">订单管理</div>
                <div class="tab-btn" data-target="products" onclick="switchPage('products', this)">商品库</div>
                <div class="tab-btn" data-target="spider" onclick="switchPage('spider', this)">AI 选品</div>
            </div>
            <div class="user-info">
                <span id="role-badge" class="role-badge super">加载中</span>
                <button class="btn" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <div class="main-content">
            <!-- 订单页 -->
            <div id="page-orders" class="page active">
                <div class="card-grid" id="orders-container"></div>
            </div>

            <!-- 商品库 -->
            <div id="page-products" class="page">
                <div class="card-grid" id="products-container"></div>
            </div>

            <!-- AI 选品 -->
            <div id="page-spider" class="page">
                <div class="card-row" style="background:#fff; padding:15px; border-radius:12px; margin-bottom:20px;">
                    <input type="text" id="keyword" placeholder="输入商品关键词" style="flex:1; padding:12px; border:1px solid #ddd; border-radius:8px; outline:none;">
                    <button class="btn btn-primary" onclick="handleCrawl()" style="margin-left:10px;">开始抓取</button>
                </div>
                <div class="card-grid" id="spider-container"></div>
            </div>
        </div>
    </div>

    <!-- 引入主入口模块 -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
