<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LYNLI 控制台登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <img src="./logo.png" alt="Logo" class="h-16 w-auto mx-auto mb-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-black text-slate-800">LYNLI 系统</h1>
            <p class="text-sm text-slate-400 mt-1">无货源智能电商中枢</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">账号</label>
                <input type="text" id="username" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">密码</label>
                <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            <div class="flex items-center justify-between pt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300">
                    <span class="text-sm text-slate-600">记住账号</span>
                </label>
            </div>
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 mt-4">登录</button>
        </form>
    </div>
    <script>
        const saved = localStorage.getItem('lynli_saved_user');
        if (saved) { document.getElementById('username').value = saved; document.getElementById('remember').checked = true; }
        if (localStorage.getItem('token')) window.location.href = '/dashboard.html';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 验证中...';

            try {
                // 关键修复：直接写死后端域名，不依赖 Vercel 代理
                const res = await fetch('https://spider.lynli.me/api/login', {
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({username: u, password: p})
                }).then(r => r.json());

                if (res.code === 200) {
                    localStorage.setItem('token', res.token);
                    localStorage.setItem('user_info', JSON.stringify(res.user));
                    if (remember) localStorage.setItem('lynli_saved_user', u);
                    else localStorage.removeItem('lynli_saved_user');
                    window.location.href = '/dashboard.html';
                } else {
                    alert(res.msg); btn.innerHTML = '登录';
                }
            } catch (err) { alert('网络错误，请检查后端服务'); btn.innerHTML = '登录'; }
        });
    </script>
</body>
</html>
