<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>LYNLI · 管理控制台</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/style.css">
  <!-- 引入 ECharts 用于图表 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 登录视图 -->
    <section id="login-view" class="auth">
      <div class="auth__bg" aria-hidden="true">
        <span class="auth__orb auth__orb--a"></span>
        <span class="auth__orb auth__orb--b"></span>
        <span class="auth__grid"></span>
      </div>
      <div class="auth__panel">
        <header class="brand">
          <div class="brand__mark"><img src="logo.png" alt="LYNLI Logo"></div>
          <div class="brand__text"><h1>LYNLI</h1><p>管理控制台</p></div>
        </header>
        <div class="auth__card">
          <div class="auth__head"><h2>登录</h2><p>请输入您的账号信息</p></div>
          <form id="login-form" novalidate>
            <label class="field">
              <span class="field__label">账号</span>
              <input class="field__input" type="text" name="account" autocomplete="username" placeholder="请输入账号" required>
            </label>
            <label class="field">
              <span class="field__label">密码</span>
              <input class="field__input" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            </label>
            <div class="auth__row">
              <label class="check"><input type="checkbox" name="remember"><span>记住账号</span></label>
              <a href="#" class="link">忘记密码？</a>
            </div>
            <p class="auth__error" id="login-error" role="alert" hidden></p>
            <button class="btn btn--primary" type="submit">
              <span class="btn__label">进入控制台</span>
              <span class="btn__spinner" aria-hidden="true"></span>
            </button>
          </form>
        </div>
        <footer class="auth__foot">© LYNLI · 仅限授权人员访问</footer>
      </div>
    </section>

    <!-- 主布局 -->
    <section id="app-view" class="app" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <div class="brand__mark brand__mark--sm"><img src="logo.png" alt="LYNLI"></div>
          <div class="sidebar__brand-text"><strong>LYNLI</strong><span>控制台</span></div>
        </div>
        <nav class="sidebar__nav" id="nav" aria-label="主菜单"></nav>
        <div class="sidebar__foot" id="sidebar-foot"></div>
      </aside>
      <div class="sidebar__scrim" id="sidebar-scrim"></div>
      <div class="app__main">
        <header class="topbar">
          <button class="icon-btn" id="menu-toggle" type="button" aria-label="打开菜单">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="topbar__title hide-mobile">
            <h1 id="page-title">数据看板</h1>
            <p id="page-sub">经营概览</p>
          </div>
          <div class="topbar__search hide-mobile">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="搜索订单、商品...">
          </div>
          <div class="topbar__actions">
            <button class="icon-btn" type="button" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="badge-dot"></span>
            </button>
            <div class="topbar__user" id="topbar-user"></div>
          </div>
        </header>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
