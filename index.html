<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNLI 后台</title>
  <style>
    body { background: #070b14; color: #fff; font-family: sans-serif; padding: 20px; }
    .card { background: #111827; border: 1px solid #374151; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .error { color: #f87171; }
    .success { color: #34d399; }
    button { background: #3b82f6; color: #fff; border: 0; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>LYNLI 调试面板</h1>
  
  <div class="card">
    <h3>后端接口测试</h3>
    <p>点击下面按钮请求你的阿里云服务器</p>
    <button id="test-btn">获取看板数据</button>
    <div id="result" style="margin-top: 15px; font-family: monospace;"></div>
  </div>

  <script>
    document.getElementById('test-btn').onclick = async () => {
      const resDiv = document.getElementById('result');
      resDiv.innerHTML = '正在请求...';
      resDiv.className = '';

      try {
        // 真实请求后端
        const res = await fetch("https://spider.lynli.me/api/dashboard");
        
        if (!res.ok) {
          throw new Error(`服务器返回错误状态码: ${res.status}`);
        }

        const json = await res.json();
        resDiv.innerHTML = `<span class="success">✅ 请求成功！</span><br><pre>${JSON.stringify(json, null, 2)}</pre>`;
        
      } catch (err) {
        // 把最详细的错误显示在屏幕上
        resDiv.innerHTML = `
          <span class="error">❌ 请求失败</span><br>
          错误信息: ${err.message}<br>
          <p style="font-size:12px;color:#9ca3af;margin-top:10px;">
            如果提示 "Failed to fetch"，说明是跨域(CORS)被拦截了。<br>
            请检查服务器端是否重启，以及 Cloudflare 是否拦截。
          </p>
        `;
      }
    };
  </script>
</body>
</html>
