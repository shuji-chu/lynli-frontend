<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOCKS5 控制台</title>
  <!-- 使用相对路径，解决 GitHub Pages 白屏 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- 登录页 -->
  <div id="login-page" class="page-container">
    <div class="login-box card">
      <div class="login-header">
        <div class="brand-logo">
          <!-- 直接用你仓库里的 logo -->
          <img src="./logo.png" alt="SOCKS5" style="width: 100%; height: 100%; object-fit: cover; border-radius: 14px;">
        </div>
        <h2>SOCKS5 控制台</h2>
        <p>欢迎回来，请登录您的账号</p>
      </div>
      
      <div class="field">
        <label class="field-label">账号</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="login-user" class="input" placeholder="请输入账号">
        </div>
      </div>

      <div class="field">
        <label class="field-label">密码</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-pass" class="input" placeholder="请输入密码">
        </div>
      </div>

      <div class="field">
        <label class="field-label">验证码</label>
        <div class="input-group">
          <input type="text" id="captcha-input" class="input" placeholder="请输入验证码" style="flex:1;">
          <div id="captcha-img" class="captcha-box" title="点击自动填充" onclick="autoFillCaptcha()"></div>
        </div>
      </div>

      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me">
          <span>记住密码</span>
        </label>
      </div>

      <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
    </div>
  </div>

  <!-- 后台主界面 -->
  <div id="main-app" class="admin-shell" style="display: none;">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="./logo.png" class="brand-mark" alt="logo" style="object-fit: cover;">
        <span class="brand-text">SOCKS5</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="javascript:void(0)" onclick="switchTab('dashboard', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-label">数据大盘</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" onclick="switchTab('accounts', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 14h4"/></svg></span>
          <span class="nav-label">账号库</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" onclick="switchTab('profile', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
          <span class="nav-label">个人中心</span>
        </a>
      </nav>
    </aside>

    <main class="admin-main">
      <!-- 数据大盘 -->
      <div class="sub-page active" id="page-dashboard">
        <div class="dashboard-grid">
          <div class="card stat-card">
            <div class="stat-title">今日营收</div>
            <div class="stat-value text-primary" id="dash-revenue">...</div>
          </div>
          <div class="card stat-card">
            <div class="stat-title">总用户</div>
            <div class="stat-value" id="dash-users">...</div>
          </div>
          <div class="card stat-card">
            <div class="stat-title">今日订单</div>
            <div class="stat-value" id="dash-orders">...</div>
          </div>
        </div>
      </div>
      
      <!-- 账号库 -->
      <div class="sub-page" id="page-accounts">
        <div class="page-header">
          <h2 class="page-title">账号库</h2>
          <button class="btn btn-primary btn-sm" onclick="loadAccounts()">刷新列表</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>商品名称</th><th>价格</th><th>库存</th><th>操作</th></tr></thead>
              <tbody id="account-list">
                <tr><td colspan="4" style="text-align:center;">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <!-- 个人中心 -->
      <div class="sub-page" id="page-profile">
        <div class="card" style="text-align: center; padding: 40px 20px;">
          <h2 style="margin: 0 0 8px; font-size: 20px;">管理员</h2>
          <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">admin@lynli.me</p>
          <button class="btn btn-danger btn-block" onclick="doLogout()">退出登录</button>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"><div class="toast-text" id="toast-text"></div></div>
  <script src="./js/app.js"></script>
</body>
</html>
