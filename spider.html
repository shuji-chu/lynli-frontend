<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynli 选品中心</title>
<style>
  :root { --bg: #f5f7fa; --white: #ffffff; --text: #1e293b; --text-sub: #64748b; --blue: #2563eb; --blue-light: #eff6ff; --border: #e2e8f0; --danger: #ef4444; }
  *{box-sizing:border-box;margin:0;padding:0}
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ============ 登录页 ============ */
  #login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--white); }
  .login-card { width: 100%; max-width: 400px; padding: 40px 30px; background: var(--white); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
  .login-logo { width: 48px; height: 48px; background: #000; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 24px; }
  .login-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .login-card p { color: var(--text-sub); font-size: 14px; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
  .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
  .btn-login { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: 0.2s; }
  .btn-login:hover { background: #333; }
  .copyright { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 40px; }

  /* ============ 主面板 ============ */
  #dashboard { display: none; flex-direction: column; min-height: 100vh; }
  .sidebar { background: var(--white); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; white-space: nowrap; }
  .sidebar-logo { padding: 15px 20px; font-weight: bold; font-size: 16px; display: none; }
  .menu-item { padding: 15px 20px; color: var(--text-sub); cursor: pointer; border-bottom: 3px solid transparent; }
  .menu-item.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .topbar { display: none; }
  .content { padding: 15px; width: 100%; }
  
  /* 工具栏 */
  .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; background: var(--white); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
  .toolbar input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px; }
  .btn { width: 100%; padding: 12px 24px; background: var(--blue); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 15px;}
  
  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; height: 220px; object-fit: cover; }
  .card-body { padding: 15px; }
  .title { font-size: 14px; font-weight: 600; margin-bottom: 12px; height: 40px; overflow: hidden; line-height: 1.4;}
  .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .price-input { width: 70px; border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--blue); font-weight: bold; font-size: 14px;}
  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;}
  .btn-up { background: var(--blue-light); color: var(--blue); }
  .btn-del { background: #fef2f2; color: var(--danger); }
  #loading { display: none; color: var(--blue); margin-bottom: 15px; text-align: center; font-weight: bold;}

  /* 电脑端适配 */
  @media (min-width: 768px) {
    #dashboard { flex-direction: row; height: 100vh; overflow: hidden; }
    .sidebar { width: 240px; border-right: 1px solid var(--border); border-bottom: none; flex-direction: column; padding: 20px 0; }
    .sidebar-logo { display: block; border-bottom: 1px solid var(--border); margin-bottom: 10px; font-size: 18px; }
    .menu-item { border-bottom: none; border-right: 3px solid transparent; padding: 12px 20px; }
    .menu-item.active { border-right-color: var(--blue); border-bottom: none; background: var(--blue-light); }
    .topbar { display: flex; height: 60px; background: var(--white); border-bottom: 1px solid var(--border); justify-content: flex-end; align-items: center; padding: 0 24px; }
    .content { padding: 30px; max-width: 1200px; margin: 0 auto; overflow-y: auto;}
    .toolbar { flex-direction: row; padding: 20px; }
    .btn { width: auto; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">L</div>
    <h1>Lynli 管理后台</h1>
    <p>AI 选品中心控制台</p>
    <div class="form-group">
      <label>管理员账号</label>
      <input type="text" id="username" placeholder="请输入账号 (admin)" value="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码 (123456)" onkeypress="if(event.key==='Enter') checkPassword()">
    </div>
    <button class="btn-login" onclick="checkPassword()">登录</button>
    <div class="copyright">© 2026 Lynli. All rights reserved.</div>
  </div>
</div>

<!-- 主面板 -->
<div id="dashboard">
  <div class="sidebar">
    <div class="sidebar-logo">Lynli Panel</div>
    <div class="menu-item">数据看板</div>
    <div class="menu-item active">AI 选品中心</div>
    <div class="menu-item">商品管理</div>
  </div>
  
  <div class="main">
    <div class="topbar"><span style="font-weight: 500;">超级管理员</span></div>
    <div class="content">
      <div class="toolbar">
        <input type="text" id="keyword" placeholder="输入商品关键词，例如：私密护理仪" onkeypress="if(event.key==='Enter') startSpider()">
        <button class="btn" onclick="startSpider()">开始抓取</button>
      </div>
      <div id="loading">⏳ 正在调度爬虫抓取并上传至 OSS...</div>
      <div class="grid" id="list"></div>
    </div>
  </div>
</div>

<script>
const API = 'https://spider.lynli.me';

// 登录验证逻辑
function checkPassword() {
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  if (user === 'admin' && pass === '123456') {
    localStorage.setItem('spider_auth', 'true');
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadDrafts();
  } else {
    alert('账号或密码错误！');
  }
}

// 页面加载检查登录状态
if (localStorage.getItem('spider_auth') === 'true') {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';
  loadDrafts();
}

async function startSpider() {
  const kw = document.getElementById('keyword').value;
  if (!kw) return alert('请输入关键词');
  
  const loading = document.getElementById('loading');
  const list = document.getElementById('list');
  loading.style.display = 'block';
  list.innerHTML = '';

  try {
    await fetch(`${API}/api/v1/admin/spider/start`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: kw })
    });
    setTimeout(loadDrafts, 3000);
  } catch (err) { alert('请求失败'); loading.style.display = 'none'; }
}

async function loadDrafts() {
  const loading = document.getElementById('loading');
  const list = document.getElementById('list');
  try {
    const res = await fetch(`${API}/api/v1/admin/spider/list`);
    const data = await res.json();
    loading.style.display = 'none';
    if (data.code !== 1) throw new Error(data.msg);
    if (data.data.length === 0) { list.innerHTML = '<div style="color:#64748b; text-align:center; padding:20px;">暂无草稿数据，请抓取。</div>'; return; }
    
    list.innerHTML = data.data.map(item => `
      <div class="card" id="card-${item.id}">
        <img src="${item.image_url.replace('http://', 'https://')}">
        <div class="card-body">
          <div class="title">${item.title}</div>
          <div class="price-row">
            <span style="color:#64748b; font-size:12px;">进价: ¥${item.price}</span>
            <span style="font-size:12px;">售价: ¥<input type="number" class="price-input" id="price-${item.id}" value="${Math.floor(item.price * 3)}"></span>
          </div>
          <div class="actions">
            <button class="btn-up" onclick="publish(${item.id})">上架</button>
            <button class="btn-del" onclick="discard(${item.id})">丢弃</button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (err) { loading.style.display = 'none'; list.innerHTML = '<div style="color:red; text-align:center; padding:20px;">拉取失败</div>'; }
}

async function publish(id) {
  const price = document.getElementById(`price-${id}`).value;
  const btn = event.target; btn.innerText = '处理中'; btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/v1/admin/spider/publish`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, price })
    });
    const data = await res.json(); alert(data.msg);
    if (data.code === 1) document.getElementById(`card-${id}`).remove(); else { btn.innerText = '上架'; btn.disabled = false; }
  } catch (err) { alert('失败'); btn.innerText = '上架'; btn.disabled = false; }
}

async function discard(id) {
  if (!confirm('确定丢弃吗？')) return;
  const btn = event.target; btn.innerText = '删除中'; btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/v1/admin/spider/discard`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    if ((await res.json()).code === 1) document.getElementById(`card-${id}`).remove(); else { btn.innerText = '丢弃'; btn.disabled = false; }
  } catch (err) { alert('失败'); btn.innerText = '丢弃'; btn.disabled = false; }
}
</script>
</body>
</html>
