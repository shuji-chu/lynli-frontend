<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNLI V6</title>
</head>
<body style="background:#070b14; color:white; padding:20px; font-family:sans-serif;">
  <h1 style="color:#10b981;">V6版本加载成功！</h1>
  <div id="login-box">
    <p>账号: <input id="acc" value="admin"></p>
    <p>密码: <input id="pwd" type="password" value="123456"></p>
    <button onclick="doLogin()" style="padding:10px 20px; background:#3b82f6; color:white; border:none;">点击登录</button>
  </div>
  
  <div id="app-box" style="display:none;">
    <h2>欢迎进入大厂后台，系统管理员</h2>
    <p>如果你看到了这句话，说明登录接口彻底打通了。</p>
  </div>

  <script>
    async function doLogin() {
      const res = await fetch('https://spider.lynli.me/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({account: document.getElementById('acc').value, password: document.getElementById('pwd').value})
      });
      const data = await res.json();
      if (data.code === 200) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('app-box').style.display = 'block';
      } else {
        alert('登录失败');
      }
    }
  </script>
</body>
</html>
