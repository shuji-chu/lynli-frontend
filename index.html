<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNLI · 管理控制台</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="login-view" class="auth">
      <div class="auth__panel">
        <header class="brand">
          <div class="brand__mark"><img src="logo.png" alt="LYNLI Logo"></div>
          <div class="brand__text"><h1>LYNLI</h1><p>管理控制台</p></div>
        </header>
        <div class="auth__card">
          <div class="auth__head"><h2>登录</h2><p>请输入您的账号信息</p></div>
          <form id="login-form">
            <label class="field">
              <span class="field__label">账号</span>
              <input class="field__input" type="text" name="account" placeholder="请输入账号" required>
            </label>
            <label class="field">
              <span class="field__label">密码</span>
              <input class="field__input" type="password" name="password" placeholder="••••••••" required>
            </label>
            <button class="btn btn--primary" type="submit">进入控制台</button>
          </form>
        </div>
      </div>
    </section>

    <section id="app-view" class="app" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <div class="brand__mark brand__mark--sm"><img src="logo.png" alt="LYNLI"></div>
          <div class="sidebar__brand-text"><strong>LYNLI</strong><span>控制台</span></div>
        </div>
        <nav class="sidebar__nav" id="nav"></nav>
      </aside>
      <div class="sidebar__scrim" id="sidebar-scrim"></div>
      <div class="app__main">
        <header class="topbar">
          <div class="topbar__title">
            <h1 id="page-title">数据看板</h1>
            <p id="page-sub">经营概览</p>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
