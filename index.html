<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LYNLI CONSOLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
    
    <div class="relative z-10 w-[90%] max-w-md p-8 bg-white/70 backdrop-blur-xl border border-white/50 shadow-2xl rounded-3xl">
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="./logo.png" alt="Logo" class="h-16 w-auto mb-4 drop-shadow-md rounded-xl">
            <h1 class="text-2xl font-black text-slate-800 tracking-wider mb-2">LYNLI CONSOLE</h1>
            <p class="text-slate-500 text-sm font-medium">无货源智能电商中枢</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <input type="text" id="username" required class="w-full py-4 px-4 bg-slate-100/50 border border-slate-200/60 rounded-2xl focus:ring-2 focus:ring-blue-500/50 outline-none" placeholder="请输入账号">
            <input type="password" id="password" required class="w-full py-4 px-4 bg-slate-100/50 border border-slate-200/60 rounded-2xl focus:ring-2 focus:ring-blue-500/50 outline-none" placeholder="请输入密码">
            
            <!-- 记住密码复选框 -->
            <div class="flex items-center px-1">
                <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="rememberPwd" class="w-4 h-4 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
                    <span class="text-sm text-slate-600">记住密码 (下次自动登录)</span>
                </label>
            </div>

            <button type="submit" class="w-full py-4 mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-blue-500/50 active:scale-[0.98] transition-all">安全登录</button>
        </form>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
