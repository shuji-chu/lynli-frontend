<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lynli 控制台</title>
  <!-- 加上 v=1.1 防手机浏览器缓存 -->
  <link rel="stylesheet" href="./css/style.css?v=1.1">
  <script src="./js/toast.js?v=1.1"></script>
  <script src="./js/api.js?v=1.1"></script>
</head>
<body>

  <!-- ================= 登录页 ================= -->
  <div id="page-login" class="page-container">
    <div class="login-box card">
      <div class="login-header">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h2>Lynli 控制台</h2>
        <p>欢迎回来，请登录您的管理账号</p>
      </div>
      
      <div class="field">
        <label class="field-label">账号</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="login-user" class="input" placeholder="请输入账号">
        </div>
      </div>

      <div class="field">
        <label class="field-label">密码</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-pass" class="input" placeholder="请输入密码">
        </div>
      </div>

      <div class="field">
        <label class="field-label">验证码</label>
        <div class="input-group">
          <input type="text" id="login-code" class="input" placeholder="请输入验证码" style="flex:1;">
          <div id="captcha-box" class="captcha-box" title="点击自动填充">XY8A</div>
        </div>
      </div>

      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me">
          <span>记住密码</span>
        </label>
        <a href="javascript:void(0)" class="link">忘记密码？</a>
      </div>

      <button class="btn btn-primary btn-block" id="btn-login">登 录</button>
      
      <div class="login-footer">
        登录即代表同意 <a href="javascript:void(0)" class="link" id="show-privacy">《隐私协议》</a>
      </div>
    </div>
  </div>

  <!-- ================= 后台主界面 ================= -->
  <div id="page-admin" class="admin-shell" style="display: none;">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"></span>
        <span class="brand-text">Lynli Pro</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item is-active" href="javascript:void(0)" data-page="dashboard">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-label">数据大盘</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" data-page="accounts">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 14h4"/></svg></span>
          <span class="nav-label">账号库</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" data-page="monitor">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg></span>
          <span class="nav-label">接口监控</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" data-page="profile">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
          <span class="nav-label">个人中心</span>
        </a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="page-content is-active" id="content-dashboard">
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">本月账号售出</div>
              <div class="card-subtitle">实时同步 V1 API</div>
            </div>
          </div>
          <div class="metric-value" id="metric-accounts">加载中...</div>
          <div class="metric-delta">较上月 <span id="metric-delta">0%</span></div>
        </div>
      </div>
      
      <div class="page-content" id="content-accounts">
        <div class="card"><div class="empty"><div class="empty-title">账号库（待开发）</div></div></div>
      </div>
      <div class="page-content" id="content-monitor">
        <div class="card"><div class="empty"><div class="empty-title">接口监控（待开发）</div></div></div>
      </div>
      <div class="page-content" id="content-profile">
        <div class="card">
          <button class="btn btn-danger btn-block" id="btn-logout">退出登录</button>
        </div>
      </div>
    </main>
  </div>

  <script src="./js/app.js?v=1.1"></script>
</body>
</html>
