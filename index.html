<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LYNLI 商家运营中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- 登录遮罩 -->
    <div id="login-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="w-full max-w-md p-8 shadow-2xl rounded-2xl border border-gray-100">
            <h2 class="text-2xl font-bold mb-6 text-center">LYNLI 管理后台</h2>
            <input type="email" id="login-email" value="admin@lynli.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 mb-4 outline-none focus:border-blue-500" placeholder="管理员邮箱">
            <input type="password" id="login-pwd" value="123456" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 mb-6 outline-none focus:border-blue-500" placeholder="密码">
            <button onclick="handleLogin()" class="w-full bg-slate-900 text-white font-medium py-3 rounded-lg hover:bg-slate-800 transition-colors">登录系统</button>
        </div>
    </div>

    <!-- 主应用 (默认隐藏) -->
    <div id="app" class="w-full h-full flex hidden">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20">
            <div class="h-16 flex items-center px-6 text-white font-bold text-xl border-b border-slate-800">
                LYNLI PRO
            </div>
            <nav class="flex-1 py-4 space-y-1" id="nav-menu">
                <a href="#" data-target="dashboard" class="nav-item flex items-center px-6 py-3 bg-blue-600 text-white transition-colors">
                    📊 数据大盘
                </a>
                <a href="#" data-target="orders" class="nav-item flex items-center px-6 py-3 hover:bg-slate-800 transition-colors">
                    📦 订单与物流
                </a>
                <a href="#" data-target="products" class="nav-item flex items-center px-6 py-3 hover:bg-slate-800 transition-colors">
                    🏷️ 商品库
                </a>
                <a href="#" data-target="users" class="nav-item flex items-center px-6 py-3 hover:bg-slate-800 transition-colors">
                    👥 用户管理
                </a>
                <a href="#" data-target="email" class="nav-item flex items-center px-6 py-3 hover:bg-slate-800 transition-colors">
                    ✉️ 邮件群发
                </a>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <main class="flex-1 flex flex-col relative overflow-hidden">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10 shrink-0">
                <div class="text-sm text-gray-500" id="breadcrumb">首页 / 数据大盘</div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium">admin@lynli.com</span>
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Admin" class="w-8 h-8 rounded-full bg-gray-200">
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8 relative" id="page-content">
                <!-- 动态渲染的页面内容 -->
            </div>
        </main>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
