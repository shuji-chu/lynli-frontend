<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYNLI PRO - 控制台</title>
    <style>
        :root { --primary: #007bff; --bg-dark: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #f8fafc; height: 100vh; overflow: hidden; }
        
        /* 登录页动画 */
        #login-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .login-bg { position: absolute; width: 400px; height: 400px; background: rgba(0, 123, 255, 0.2); border-radius: 50%; filter: blur(80px); animation: pulse 4s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
        .login-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; position: relative; z-index: 10; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .login-logo { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 18px; background: var(--primary); color: white; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
        .login-card h2 { color: #1e293b; margin-bottom: 8px; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; }
        .login-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #0056b3; }
        
        /* 主面板 */
        #main-app { display: none; height: 100vh; }
        .sidebar { width: 240px; background: var(--bg-dark); display: flex; flex-direction: column; }
        .sidebar-logo { height: 70px; display: flex; align-items: center; padding: 0 20px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: white; font-weight: bold; font-size: 20px; }
        .sidebar-logo .icon { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .nav-item { padding: 15px 20px; color: #94a3b8; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(0, 123, 255, 0.1); color: var(--primary); border-left-color: var(--primary); font-weight: bold; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #f8fafc; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 30px; font-weight: bold; font-size: 18px; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 20px; }
        .tag { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-right: 10px; }
        .tag-g { background: #dcfce7; color: #166534; } .tag-b { background: #e0f2fe; color: #0284c7; }
        .code { background: #0f172a; color: #10b981; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 12px 0; border-bottom: 1px solid #f1f5f9; text-align: left; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo">S5</div>
            <h2>LYNLI PRO</h2>
            <p>请输入管理员凭证登录系统</p>
            <div class="input-group"><input type="text" placeholder="管理员账号"></div>
            <div class="input-group"><input type="password" placeholder="••••••••"></div>
            <button class="login-btn" onclick="doLogin()">立即登录</button>
        </div>
    </div>

    <div id="main-app" style="display: flex;">
        <div class="sidebar">
            <div class="sidebar-logo"><div class="icon">S5</div> LYNLI</div>
            <div class="nav-item active" onclick="switchPage('dashboard', this)">数据大盘</div>
            <div class="nav-item" onclick="switchPage('catalog', this)">API 市场</div>
        </div>
        <div class="main-content">
            <div class="header" id="page-title">数据大盘</div>
            <div class="content" id="content-area"></div>
        </div>
    </div>

    <script>
        function doLogin() {
            const btn = document.querySelector('.login-btn');
            btn.innerText = '正在验证...';
            setTimeout(() => {
                document.getElementById('login-page').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    switchPage('dashboard', document.querySelector('.nav-item'));
                }, 500);
            }, 600);
        }

        function switchPage(page, el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (el) el.classList.add('active');
            const content = document.getElementById('content-area');
            const title = document.getElementById('page-title');

            if (page === 'dashboard') {
                title.innerText = '数据大盘';
                content.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                        <div class="card"><div style="color:#64748b; font-size:14px;">今日总营收</div><div style="font-size:28px; font-weight:bold; color:#10b981; margin-top:10px;">¥ 3,250.00</div></div>
                        <div class="card"><div style="color:#64748b; font-size:14px;">新增用户</div><div style="font-size:28px; font-weight:bold; color:#007bff; margin-top:10px;">128</div></div>
                        <div class="card"><div style="color:#64748b; font-size:14px;">运行状态</div><div style="font-size:28px; font-weight:bold; color:#10b981; margin-top:10px;">正常</div></div>
                    </div>
                `;
            } else if (page === 'catalog') {
                title.innerText = 'API 接口市场';
                content.innerHTML = `
                    <div style="max-width: 900px;">
                        <div style="color: #007bff; font-size: 12px; font-weight: bold; margin-bottom: 10px;">API MARKET / 手机号码</div>
                        <h1 style="font-size: 28px; margin-bottom: 15px;">手机号二要素认证</h1>
                        <div style="margin-bottom: 20px;"><span class="tag tag-g">正常</span><span class="tag tag-b">POST</span><span class="tag tag-b">JSON</span></div>
                        <div class="card"><h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 15px;">请求参数</h3><table><thead><tr><th>参数名</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td style="color:#007bff; font-family:monospace;">name</td><td style="color:red;">是</td><td>真实姓名</td></tr><tr><td style="color:#007bff; font-family:monospace;">phone</td><td style="color:red;">是</td><td>手机号码</td></tr></tbody></table></div>
                        <div class="card"><h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 15px;">返回示例</h3><div class="code">{\n  "code": 200,\n  "data": {\n    "verify_status": 1,\n    "desc": "一致"\n  }\n}</div></div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
