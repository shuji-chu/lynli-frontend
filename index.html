<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYNLI CONSOLE - 无货源智能电商中枢</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

    <!-- 动态流光背景 -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-cyan-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>

    <!-- 登录卡片 -->
    <div class="relative z-10 w-full max-w-md p-6 sm:p-10 bg-white/70 backdrop-blur-xl border border-white/50 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] rounded-3xl mx-4 sm:mx-0">
        
        <!-- 头部 Logo 与标题 -->
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="./logo.png" alt="LYNLI Logo" class="h-16 sm:h-20 w-auto mb-4 object-contain drop-shadow-md rounded-xl">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-wider mb-2">LYNLI CONSOLE</h1>
            <p class="text-slate-500 text-sm font-medium tracking-wide">无货源智能电商中枢</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="space-y-6">
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                    <i class="fa-regular fa-user text-lg"></i>
                </div>
                <input type="text" id="username" required
                    class="w-full py-4 pl-12 pr-4 bg-slate-100/50 border border-slate-200/60 rounded-2xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 focus:bg-white transition-all duration-300"
                    placeholder="请输入管理员账号">
            </div>

            <div class="relative group">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <input type="password" id="password" required
                    class="w-full py-4 pl-12 pr-12 bg-slate-100/50 border border-slate-200/60 rounded-2xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 focus:bg-white transition-all duration-300"
                    placeholder="请输入密码">
                <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-regular fa-eye-slash text-lg"></i>
                </button>
            </div>

            <div class="flex items-center justify-between mt-2 px-1">
                <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer transition-all">
                    <span class="text-sm text-slate-600 group-hover:text-slate-800 transition-colors">记住密码</span>
                </label>
            </div>

            <button type="submit"
                class="w-full py-4 mt-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 active:scale-[0.98] transition-all duration-200">
                安全登录
            </button>
        </form>
    </div>

    <!-- 引入主逻辑 -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
