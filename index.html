<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNLI · 管理控制台</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 登录视图 -->
    <section id="login-view" class="auth">
      <div class="auth__panel">
        <header class="brand">
          <div class="brand__mark"><img src="logo.png" alt="Logo"></div>
          <div class="brand__text"><h1>LYNLI</h1><p>管理控制台</p></div>
        </header>
        <div class="auth__card">
          <div class="auth__head"><h2>登录</h2><p>请输入您的账号信息</p></div>
          <form id="login-form">
            <label class="field">
              <span class="field__label">账号</span>
              <input class="field__input" type="text" name="account" value="admin" placeholder="请输入账号" required>
            </label>
            <label class="field">
              <span class="field__label">密码</span>
              <input class="field__input" type="password" name="password" value="123456" placeholder="••••••••" required>
            </label>
            <button class="btn btn--primary" type="submit">进入控制台</button>
          </form>
        </div>
      </div>
    </section>

    <!-- 主界面 -->
    <section id="app-view" class="app" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <div class="brand__mark brand__mark--sm"><img src="logo.png"></div>
          <div class="sidebar__brand-text"><strong>LYNLI</strong><span>控制台</span></div>
        </div>
        <nav class="sidebar__nav">
          <div class="nav-title">概览</div>
          <button class="nav-item active" data-route="dashboard">数据看板</button>
          
          <div class="nav-title">交易中心</div>
          <button class="nav-item" data-route="orders">全部订单</button>
          <button class="nav-item" data-route="purchase">采购与代发</button>
          
          <div class="nav-title">商品中心</div>
          <button class="nav-item" data-route="spider">AI 选品</button>
          <button class="nav-item" data-route="products">商品库</button>
        </nav>
        <div class="sidebar__foot">
          <div class="user-chip">
            <div class="user-chip__avatar">管</div>
            <div class="user-chip__meta">
              <strong>系统管理员</strong>
              <span>admin@lynli.me</span>
            </div>
          </div>
        </div>
      </aside>
      <div class="sidebar__scrim" id="sidebar-scrim"></div>
      <div class="app__main">
        <header class="topbar">
          <div class="topbar__title">
            <h1 id="page-title">数据看板</h1>
            <p id="page-sub">经营概览</p>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
    </section>
  </div>

  <!-- 所有的逻辑直接内联在这里，绝对不存在文件找不到的问题 -->
  <script>
    // 1. 登录逻辑
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = "正在认证...";
      btn.disabled = true;

      try {
        const res = await fetch("https://spider.lynli.me/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            account: e.target.account.value,
            password: e.target.password.value
          })
        });
        const data = await res.json();

        if (data.code === 200) {
          document.getElementById("login-view").style.display = "none";
          document.getElementById("app-view").hidden = false;
          window.loadPage("dashboard");
        } else {
          alert("登录失败: " + data.message);
        }
      } catch (err) {
        alert("网络请求失败，请检查跨域或后端状态");
      } finally {
        btn.textContent = "进入控制台";
        btn.disabled = false;
      }
    };

    // 2. 简单的路由和渲染
    window.loadPage = async (route) => {
      const content = document.getElementById("content");
      content.innerHTML = `<div class="card"><h2>加载中...</h2></div>`;
      
      // 顶部菜单高亮
      document.querySelectorAll(".nav-item").forEach(el => {
        el.classList.toggle("active", el.dataset.route === route);
      });

      if (route === "dashboard") {
        document.getElementById("page-title").textContent = "数据看板";
        try {
          const res = await fetch("https://spider.lynli.me/api/dashboard");
          const json = await res.json();
          const d = json.data;
          content.innerHTML = `
            <div class="kpi-grid">
              <div class="card kpi"><div class="kpi__label">今日营收</div><div class="kpi__value">¥ ${d.revenue.toFixed(2)}</div></div>
              <div class="card kpi"><div class="kpi__label">今日订单</div><div class="kpi__value">${d.orders_today}</div></div>
              <div class="card kpi"><div class="kpi__label">待发货</div><div class="kpi__value" style="color:#f87171;">${d.pending_ship}</div></div>
              <div class="card kpi"><div class="kpi__label">在售商品</div><div class="kpi__value">${d.total_prod}</div></div>
            </div>
            <div class="card"><h2>欢迎回来，系统管理员！</h2><p style="color:var(--text-dim);margin-top:8px;">左侧菜单点击即可切换真实业务模块。</p></div>
          `;
        } catch (e) { content.innerHTML = `<h2>加载失败，请检查网络</h2>`; }
      } 
      
      else if (route === "orders") {
        document.getElementById("page-title").textContent = "全部订单";
        const res = await fetch("https://spider.lynli.me/api/orders");
        const json = await res.json();
        content.innerHTML = `
          <div class="card">
            <table class="table">
              <thead><tr><th>订单号</th><th>买家</th><th>金额</th><th>状态</th></tr></thead>
              <tbody>${json.data.map(o => `<tr>
                <td>${o.id}</td><td>${o.buyer}</td><td>¥${o.amount}</td>
                <td><span class="tag tag-${o.status}">${o.status}</span></td>
              </tr>`).join('')}</tbody>
            </table>
          </div>
        `;
      }

      else if (route === "spider") {
        document.getElementById("page-title").textContent = "AI 选品";
        content.innerHTML = `<div class="card"><h2>多平台抓取</h2><p style="margin-top:10px;color:var(--text-dim);">接口已就绪（此处省略复杂抓取UI以方便测试）。</p></div>`;
      }
      
      else {
        document.getElementById("page-title").textContent = "开发中";
        content.innerHTML = `<div class="card"><h2>该模块功能已打通数据库，等待装载UI</h2></div>`;
      }
    };

    // 3. 绑定菜单点击事件
    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.onclick = () => loadPage(btn.dataset.route);
    });
  </script>
</body>
</html>
