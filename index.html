<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>LYNLI 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-80">
        <h2 class="text-xl font-bold mb-6 text-center">LYNLI 管理后台</h2>
        <form id="form">
            <input type="text" id="u" placeholder="账号" class="w-full p-3 mb-4 bg-slate-50 border rounded-lg" value="admin">
            <input type="password" id="p" placeholder="密码" class="w-full p-3 mb-4 bg-slate-50 border rounded-lg" value="123456">
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">登录</button>
        </form>
    </div>
    <script>
        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = '验证中...';

                    headers: {'Content-Type': 'application/json'},

</body>
</html>
