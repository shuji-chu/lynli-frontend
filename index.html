<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOCKS5 管理中枢</title>
  <!-- S5 品牌图标 -->
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- 使用相对路径，解决 GitHub Pages 白屏 -->
  <link rel="stylesheet" href="./css/style.css">
  <!-- Leaflet 地图库（卫星地图） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <!-- Anime.js 丝滑动画 -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
</head>
<body>

  <!-- 登录页 -->
  <div id="login-page" class="page-container">
    <div class="login-box card">
      <div class="login-header">
        <div class="brand-logo">
          <!-- 直接用你仓库里的 logo -->
          <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; font-weight: bold; font-size: 32px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin: 0 auto 20px; box-shadow: 0 4px 12px rgba(59,130,246,0.3);">S5</div>
        </div>
        <h2>SOCKS5 管理中枢</h2>
        <p>欢迎回来，请登录您的账号</p>
      </div>
      
      <div class="field">
        <label class="field-label">账号</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="login-user" class="input" placeholder="请输入账号">
        </div>
      </div>

      <div class="field">
        <label class="field-label">密码</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-pass" class="input" placeholder="请输入密码">
        </div>
      </div>

      <div class="field">
        <label class="field-label">验证码 <span style="font-size:12px; color:var(--text-muted); font-weight:400;">（点击图片可刷新）</span></label>
        <div class="captcha-row">
          <input type="text" id="captcha-input" class="input captcha-input" maxlength="4" placeholder="4 位字符" autocomplete="off" spellcheck="false" style="text-transform:uppercase;">
          <canvas id="captcha-canvas" class="captcha-canvas" width="120" height="44" title="看不清？点击刷新" onclick="refreshCaptcha()"></canvas>
        </div>
      </div>

      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me">
          <span>记住密码</span>
        </label>
      </div>

      <button id="btn-login" class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
    </div>
  </div>

  <!-- 后台主界面 -->
  <div id="main-app" class="admin-shell" style="display: none;">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="./logo.png" class="brand-mark" alt="logo" style="object-fit: cover;">
        <span class="brand-text">SOCKS5</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="javascript:void(0)" onclick="switchTab('dashboard', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-label">数据大盘</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" onclick="switchTab('accounts', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 14h4"/></svg></span>
          <span class="nav-label">账号库</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" onclick="switchTab('map', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 4 5.6 4 9s-1.2 6.4-4 9c-2.8-2.6-4-5.6-4-9s1.2-6.4 4-9z"/></svg></span>
          <span class="nav-label">节点地图</span>
        </a>
        <a class="nav-item" href="javascript:void(0)" onclick="switchTab('profile', this)">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
          <span class="nav-label">个人中心</span>
        </a>
      </nav>
    </aside>

    <main class="admin-main">
      <!-- 数据大盘 -->
      <div class="sub-page active" id="page-dashboard">
        <div class="dashboard-grid">
          <div class="card stat-card">
            <div class="stat-title">今日营收</div>
            <div class="stat-value text-primary" id="dash-revenue">...</div>
          </div>
          <div class="card stat-card">
            <div class="stat-title">总用户</div>
            <div class="stat-value" id="dash-users">...</div>
          </div>
          <div class="card stat-card">
            <div class="stat-title">今日订单</div>
            <div class="stat-value" id="dash-orders">...</div>
          </div>
        </div>
      </div>
      
      <!-- 账号库 -->
      <div class="sub-page" id="page-accounts">
        <div class="page-header">
          <h2 class="page-title">账号库</h2>
          <button class="btn btn-primary btn-sm" onclick="loadAccounts()">刷新列表</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>商品名称</th><th>价格</th><th>库存</th><th>操作</th></tr></thead>
              <tbody id="account-list">
                <tr><td colspan="4" style="text-align:center;">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <!-- 节点地图 -->
      <div class="sub-page" id="page-map">
        <div class="page-header">
          <h2 class="page-title">节点地图</h2>
          <button class="btn btn-primary btn-sm" onclick="initNodeMap(true)">刷新节点</button>
        </div>
        <div class="card map-card">
          <div id="node-map"></div>
          <div class="map-legend">
            <span class="legend-item"><i class="dot dot-live"></i>在线节点</span>
            <span class="legend-item"><i class="dot dot-off"></i>离线节点</span>
            <span class="legend-note">卫星影像 · 实时节点分布</span>
          </div>
        </div>
      </div>

      <!-- 个人中心 -->
      <div class="sub-page" id="page-profile">
        <div class="card" style="text-align: center; padding: 40px 20px;">
          <h2 style="margin: 0 0 8px; font-size: 20px;">管理员</h2>
          <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">admin@lynli.me</p>
          <button class="btn btn-danger btn-block" onclick="doLogout()">退出登录</button>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"><div class="toast-text" id="toast-text"></div></div>
  <!-- Leaflet JS -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/map-page.js"></script>
</body>
</html>
