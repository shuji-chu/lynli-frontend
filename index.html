<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNLI 控制台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="login-view" class="auth">
      <div class="auth-card">
        <h1>LYNLI</h1>
        <p>大厂级无货源管理后台</p>
        <form id="login-form">
          <input type="text" name="account" value="admin" placeholder="账号" required>
          <input type="password" name="password" value="123456" placeholder="密码" required>
          <button type="submit" id="login-btn">进入控制台</button>
        </form>
      </div>
    </section>

    <section id="app-view" class="app" hidden>
      <aside class="sidebar">
        <div class="logo">LYNLI</div>
        <nav id="nav-menu"></nav>
      </aside>
      <div class="main">
        <header class="topbar"><h1 id="page-title">数据看板</h1></header>
        <main class="content" id="content"></main>
      </div>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
