<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynli 独立电商后台</title>
<style>
  :root { --bg: #f5f7fa; --white: #ffffff; --text: #1e293b; --text-sub: #64748b; --blue: #2563eb; --border: #e2e8f0; }
  *{box-sizing:border-box;margin:0;padding:0}
  body { background: var(--bg); color: var(--text); font: 14px/1.6 sans-serif; display: flex; height: 100vh; }
  .sidebar { width: 200px; background: var(--white); border-right: 1px solid var(--border); padding: 20px 0; }
  .menu { padding: 12px 20px; cursor: pointer; color: var(--text-sub); }
  .menu.active { background: #eff6ff; color: var(--blue); font-weight: bold; border-left: 4px solid var(--blue); }
  .main { flex: 1; padding: 20px; overflow-y: auto; }
  .card { background: var(--white); border-radius: 12px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 12px; border-bottom: 1px solid var(--border); }
  .btn { background: var(--blue); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
  <div class="sidebar">
    <div style="font-weight: bold; padding: 0 20px 20px; border-bottom: 1px solid var(--border);">电商后台</div>
    <div class="menu active" onclick="switchTab('orders', this)">订单管理</div>
    <div class="menu" onclick="switchTab('spider', this)">AI 选品</div>
    <div class="menu" onclick="switchTab('products', this)">商品库</div>
  </div>

  <div class="main">
    <div id="tab-orders" class="tab-content">
      <h2>订单管理</h2>
      <div class="card">
        <table>
          <thead><tr><th>订单号</th><th>收件人</th><th>地址</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="order-list"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-spider" class="tab-content" style="display:none;">
      <h2>AI 抓取</h2>
      <div class="card" style="display:flex; gap:10px;">
        <input type="text" id="keyword" placeholder="输入关键词" style="flex:1; padding:10px; border:1px solid var(--border); border-radius:6px;">
        <button class="btn" onclick="startSpider()">开始抓取</button>
      </div>
      <div class="grid" id="spider-list"></div>
    </div>
    
    <div id="tab-products" class="tab-content" style="display:none;">
      <h2>商品库</h2>
      <div class="grid" id="product-list"></div>
    </div>
  </div>

<script>
const API = 'https://spider.lynli.me';

function switchTab(tabId, el) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.menu').forEach(m => m.classList.remove('active'));
  document.getElementById('tab-' + tabId).style.display = 'block';
  el.classList.add('active');
  if (tabId === 'orders') loadOrders();
  if (tabId === 'spider') loadSpider();
  if (tabId === 'products') loadProducts();
}

async function loadOrders() {
  const res = await fetch(`${API}/api/shop/orders`);
  const data = await res.json();
  if (data.code === 1) {
    document.getElementById('order-list').innerHTML = data.data.map(o => `
      <tr>
        <td>${o.trade_no}</td>
        <td>${o.receiver}<br><span style="color:#64748b">${o.phone}</span></td>
        <td>${o.address}</td>
        <td style="color:${o.status==='待发货'?'red':'green'}">${o.status}</td>
        <td>${o.status === '待发货' ? `<button class="btn" onclick="ship('${o.trade_no}')">发货</button>` : o.tracking_no}</td>
      </tr>
    `).join('');
  }
}

async function ship(trade_no) {
  const tracking_no = prompt("请输入快递单号:");
  if (!tracking_no) return;
  await fetch(`${API}/api/shop/ship`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ trade_no, tracking_no })
  });
  loadOrders();
}

async function loadProducts() {
  const res = await fetch(`${API}/api/shop/products`);
  const data = await res.json();
  if (data.code === 1) {
    document.getElementById('product-list').innerHTML = data.data.map(p => `
      <div class="card">
        <img src="${p.image}" style="width:100%; height:120px; object-fit:cover; border-radius:6px;">
        <div style="font-weight:bold; margin-top:8px;">${p.name}</div>
        <div style="color:red;">售价: ¥${p.price}</div>
      </div>
    `).join('');
  }
}

async function startSpider() {
  const kw = document.getElementById('keyword').value;
  await fetch(`${API}/api/spider/start`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: kw }) });
  setTimeout(loadSpider, 3000);
}

async function loadSpider() {
  const res = await fetch(`${API}/api/spider/list`);
  const data = await res.json();
  if (data.code === 1) {
    document.getElementById('spider-list').innerHTML = data.data.map(item => `
      <div class="card">
        <img src="${item.image_url.replace('http://', 'https://')}" style="width:100%; height:150px; object-fit:cover; border-radius:6px;">
        <div style="font-weight:bold; margin-top:8px;">${item.title}</div>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
          <span>进价: ¥${item.price}</span>
          <button class="btn" onclick="publish(${item.id})">上架</button>
        </div>
      </div>
    `).join('');
  }
}

async function publish(id) {
  const price = prompt("设置零售价:");
  if(!price) return;
  await fetch(`${API}/api/shop/publish`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, price }) });
  loadSpider();
}

loadOrders();
</script>
</body>
</html>
