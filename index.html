<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>LYNLI · 管理控制台</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- 登录视图 -->
    <section id="login-view" class="auth">
      <div class="auth__bg" aria-hidden="true">
        <span class="auth__orb auth__orb--a"></span>
        <span class="auth__orb auth__orb--b"></span>
        <span class="auth__grid"></span>
      </div>

      <div class="auth__panel">
        <header class="brand">
          <div class="brand__mark">
            <img src="logo.png" alt="LYNLI Logo">
          </div>
          <div class="brand__text">
            <h1>LYNLI</h1>
            <p>管理控制台</p>
          </div>
        </header>

        <div class="auth__card">
          <div class="auth__head">
            <h2>登录</h2>
            <p>选择身份，进入对应工作台</p>
          </div>

          <div class="role-switch" role="tablist" aria-label="登录身份">
            <button type="button" class="role-switch__item is-active" data-role="super_admin" role="tab" aria-selected="true">超级管理员</button>
            <button type="button" class="role-switch__item" data-role="operator" role="tab" aria-selected="false">运营</button>
            <button type="button" class="role-switch__item" data-role="support" role="tab" aria-selected="false">客服</button>
          </div>

          <form id="login-form" novalidate>
            <label class="field">
              <span class="field__label">邮箱</span>
              <input class="field__input" type="email" name="email" autocomplete="username" placeholder="you@lynli.me" required>
            </label>

            <label class="field">
              <span class="field__label">密码</span>
              <input class="field__input" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            </label>

            <div class="auth__row">
              <label class="check">
                <input type="checkbox" name="remember">
                <span>记住邮箱</span>
              </label>
              <a href="#" class="link">忘记密码？</a>
            </div>

            <p class="auth__error" id="login-error" role="alert" hidden></p>

            <button class="btn btn--primary" type="submit">
              <span class="btn__label">进入控制台</span>
              <span class="btn__spinner" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <footer class="auth__foot">
          © LYNLI · 仅限授权人员访问
        </footer>
      </div>
    </section>

    <!-- 主布局 -->
    <section id="app-view" class="app" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <div class="brand__mark brand__mark--sm">
            <img src="logo.png" alt="LYNLI">
          </div>
          <div class="sidebar__brand-text">
            <strong>LYNLI</strong>
            <span>控制台</span>
          </div>
        </div>

        <nav class="sidebar__nav" id="nav" aria-label="主菜单"></nav>

        <div class="sidebar__foot" id="sidebar-foot"></div>
      </aside>

      <div class="sidebar__scrim" id="sidebar-scrim"></div>

      <div class="app__main">
        <header class="topbar">
          <button class="icon-btn" id="menu-toggle" type="button" aria-label="打开菜单">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>

          <div class="topbar__title">
            <h1 id="page-title">数据看板</h1>
            <p id="page-sub">经营概览</p>
          </div>

          <div class="topbar__user" id="topbar-user"></div>
        </header>

        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </section>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
