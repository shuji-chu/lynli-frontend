<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>LYNLI Console</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 登录页 -->
    <div id="login-screen">
        <div class="bg-person"></div>
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: 1px;">LYNLI CONSOLE</h2>
                <p style="color: #64748b; font-size: 13px; margin-top: 4px;">无货源智能电商中枢</p>
            </div>
            <div class="input-group">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <input type="text" id="login-user" placeholder="管理员账号" value="admin">
            </div>
            <div class="input-group">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <input type="password" id="login-pwd" placeholder="密码" value="123456">
                <svg class="toggle-pwd" onclick="togglePwd()" id="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 24px; font-size: 13px; color: #64748b;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="remember-pwd" style="accent-color: #2563eb;"> 记住密码
                </label>
                <a href="#" style="color: #2563eb; text-decoration: none;">忘记密码？</a>
            </div>
            <button class="btn-primary" onclick="window.handleLogin()">安全登录</button>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div id="sidebar" class="sidebar" style="padding-top: 20px;">
        <div style="padding: 0 20px 20px; font-weight: 800; font-size: 18px; border-bottom: 1px solid #f1f5f9; margin-bottom: 10px;">LYNLI PRO</div>
        <a href="#" data-target="dashboard" class="nav-item active">📊 数据大盘</a>
        <a href="#" data-target="orders" class="nav-item">📦 订单与物流</a>
        <a href="#" data-target="products" class="nav-item">🏷️ 商品库</a>
        <a href="#" data-target="spider" class="nav-item">🕷️ AI 智能选品</a>
        <a href="#" data-target="users" class="nav-item">👥 会员列表</a>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- 顶部 -->
    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="menu-btn" onclick="toggleSidebar()" style="background:none; border:none; font-size:24px; cursor:pointer;">☰</button>
            <span id="breadcrumb" style="font-weight: bold; font-size: 16px;">数据大盘</span>
        </div>
        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Admin" style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;">
    </div>

    <div class="main-content" id="page-content"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
