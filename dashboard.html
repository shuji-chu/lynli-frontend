<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LYNLI 控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50 font-sans relative">

    <!-- 移动端遮罩层 -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- 侧边栏 -->
    <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col z-30 absolute md:relative h-full transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
            <span class="text-lg font-black text-white">LYNLI CONSOLE</span>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-2 overflow-y-auto">
            <a href="#dashboard" class="nav-link flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-chart-pie w-8"></i> 看板</a>
            <a href="#products" class="nav-link flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-box w-8"></i> 商品</a>
            <a href="#orders" class="nav-link flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-file-invoice w-8"></i> 订单</a>
            <a href="#spider" class="nav-link flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-robot w-8"></i> 选品</a>
        </nav>
        <!-- 退出登录按钮 -->
        <div class="p-4 border-t border-slate-800">
            <button id="logoutBtn" class="w-full flex items-center justify-center px-4 py-2 bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white rounded-xl transition-colors font-medium">
                <i class="fa-solid fa-power-off mr-2"></i> 退出登录
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col w-full h-full">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center px-4 shrink-0">
            <button onclick="toggleSidebar()" class="md:hidden mr-4 text-slate-600 hover:text-slate-900 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <h2 id="page-title" class="text-lg font-bold">数据看板</h2>
        </header>
        
        <div id="app-view" class="flex-1 p-4 overflow-auto w-full"></div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }
    </script>
    <script type="module" src="./js/router.js"></script>
</body>
</html>
