<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>LYNLI 商家运营中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* 科技感背景 */
        #login-screen {
            position: fixed; inset: 0; z-index: 999;
            background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        /* 科技网格 */
        #login-screen::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0;
        }
        /* 透明发光人物背景 */
        .bg-character {
            position: absolute; bottom: 0; right: -10%; height: 90vh; width: 100%;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop'); /* 赛博人物抽象图 */
            background-size: cover; background-position: center;
            mask-image: linear-gradient(to left, rgba(0,0,0,0.8), transparent);
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0.8), transparent);
            opacity: 0.3; mix-blend-mode: screen; z-index: 1;
        }
        
        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            z-index: 10; position: relative;
        }
        
        /* 输入框样式 */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; width: 20px; height: 20px; }
        .input-group input {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 14px 16px 14px 48px; border-radius: 12px; outline: none; font-size: 15px;
            transition: all 0.3s;
        }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); background: rgba(0,0,0,0.4); }
        
        .toggle-pwd { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; width: 20px; height: 20px; }
        
        .checkbox-wrap { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 14px; cursor: pointer; }
        .checkbox-wrap input { width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer; }

        /* 顶部导航 */
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-b: 1px solid #f1f5f9; z-index: 50; }
        
        /* 侧边栏 */
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: #ffffff; border-right: 1px solid #f1f5f9; z-index: 100; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.open { transform: translateX(0); box-shadow: 20px 0 40px rgba(0,0,0,0.05); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 4px 12px; border-radius: 10px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .nav-item:hover { background: #f8fafc; color: #0f172a; }
        .nav-item.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
        .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
        
        /* 遮罩 */
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
        .overlay.open { display: block; opacity: 1; }
        
        /* 主内容区 */
        .main-content { padding: 80px 16px 30px 16px; }
        
        /* 卡片质感 */
        .stat-card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; position: relative; overflow: hidden; }
        .card { background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; margin-bottom: 16px; }
        
        /* 电脑端适配 */
        @media (min-width: 768px) {
            .sidebar { transform: translateX(0); box-shadow: none; }
            .main-content { margin-left: 260px; padding: 90px 40px 40px 40px; }
            .overlay { display: none !important; }
            .menu-btn { display: none; }
            .bg-character { width: 60%; right: 0; opacity: 0.5; }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="login-screen">
        <div class="bg-character"></div>
        
        <div class="glass-card w-[90%] max-w-[400px] rounded-[24px] p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-[0_0_30px_rgba(37,99,235,0.5)]">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-widest mb-1">LYNLI CONSOLE</h2>
                <p class="text-blue-300 text-xs tracking-wider uppercase">无货源智能电商中枢</p>
            </div>

            <div class="input-group">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <input type="text" id="login-user" placeholder="管理员账号 (admin)" value="admin">
            </div>

            <div class="input-group">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <input type="password" id="login-pwd" placeholder="密码 (123456)" value="123456">
                <svg class="toggle-pwd" onclick="togglePassword()" id="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </div>

            <div class="flex justify-between items-center mb-6">
                <label class="checkbox-wrap">
                    <input type="checkbox" id="remember-pwd" checked>
                    记住密码
                </label>
                <a href="#" class="text-blue-400 text-sm hover:text-blue-300">忘记密码？</a>
            </div>

            <button onclick="window.handleLogin()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3.5 rounded-xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)]">
                安全登录
            </button>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div id="sidebar" class="sidebar pt-6">
        <div class="px-8 pb-8 flex items-center gap-3">
            <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">L</div>
            <span class="font-bold text-xl text-slate-900 tracking-tight">LYNLI PRO</span>
        </div>
        <a href="#" data-target="dashboard" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            数据大盘
        </a>
        <a href="#" data-target="orders" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            订单与物流
        </a>
        <a href="#" data-target="products" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            商品库
        </a>
        <a href="#" data-target="spider" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>
            AI 智能选品
        </a>
        <a href="#" data-target="users" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            会员列表
        </a>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="flex items-center gap-3">
            <button class="menu-btn text-slate-600" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <span id="breadcrumb" class="font-bold text-slate-800 text-lg tracking-tight">数据大盘</span>
        </div>
        <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Admin" class="w-9 h-9 rounded-full ring-2 ring-slate-100">
    </div>

    <!-- 主内容 -->
    <div class="main-content" id="page-content"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
