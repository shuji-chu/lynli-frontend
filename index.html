<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LYNLI 控制台登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <img src="./logo.png" alt="Logo" class="h-16 w-auto mx-auto mb-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-black text-slate-800">LYNLI 系统</h1>
            <p class="text-sm text-slate-400 mt-1">无货源智能电商中枢</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">账号</label>
                <input type="text" id="username" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">密码</label>
                <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all mt-4">登录</button>
        </form>
    </div>
    <script>
        // 直接请求，直连服务器
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '验证中...';
            try {
                const res = await fetch('https://spider.lynli.me/api/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                }).then(r => r.json());
                
                if(res.code === 200) {
                    localStorage.setItem('token', res.token);
                    localStorage.setItem('user_info', JSON.stringify(res.user));
                    window.location.href = '/dashboard.html';
                } else {
                    alert(res.msg);
                    btn.innerHTML = '登录';
                }
            } catch (e) {
                alert('网络错误');
                btn.innerHTML = '登录';
            }
        });
    </script>
</body>
</html>
